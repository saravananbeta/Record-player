  <title>Record Player</title>
  
  <!-- Cursive Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      background-color: transparent;
      color: #fff;
    }

    body {
      background-color: #000;
      font-family: sans-serif;
    }

    /* Fullscreen Background Image */
    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      object-fit: cover !important;
      object-position: top center;
      z-index: 1;
      pointer-events: none;
    }

    /* Cursive Title at Top Left */
    .app-header {
      position: fixed;
      top: 25px;
      left: 35px;
      z-index: 10;
      pointer-events: none;
    }

    .app-header h1 {
      font-family: 'Great Vibes', 'Brush Script MT', cursive;
      font-size: 3.4rem;
      font-weight: 400;
      color: #ffb703;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.8);
      line-height: 1;
    }

    /* Top Right Container for Clock & Mute Button */
    .top-right-container {
      position: fixed;
      top: 25px;
      right: 35px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    /* Digital Time Display at Top Right */
    .time-display {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    /* Mute Button below Clock */
    .mute-btn {
      display: none;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.9rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .mute-btn:hover {
      background: rgba(0, 0, 0, 0.85);
    }

    /* Centered Container for Sleep Timer above the Player */
    .timer-bar {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Sleep Timer Button Styling */
    #sleepBtn {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-size: 0.8rem;
      padding: 6px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    #sleepBtn:hover {
      color: #ffb703;
      border-color: #ffb703;
    }

    /* Sleep Menu Popup Options */
    .timer-container {
      position: relative;
      display: inline-block;
    }

    .sleep-menu {
      display: none;
      position: absolute;
      bottom: 100% !important;
      left: 50%;
      transform: translate(-50%, -18px) !important;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      flex-direction: column;
      gap: 4px;
      min-width: 110px;
      z-index: 20;
    }

    .sleep-menu.is-open {
      display: flex;
    }

    .sleep-menu button {
      background: transparent;
      border: none;
      color: #fff;
      padding: 6px 12px;
      font-size: 0.78rem;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .sleep-menu button:hover {
      background: #ffb703;
      color: #000;
    }

    
    /* Base Player Bar (Desktop & Laptops) */
    /* Base Container */
.player-bar {
  position: fixed;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  flex-direction: column;
  width: 90%;
  max-width: 600px;
  box-sizing: border-box;
  padding: 12px 24px;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 50px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
}

.player-top-row {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  gap: 12px;
}

.meta-details-mobile {
  display: none;
}


      /* Constant container width */
    .track-info {
      width: 220px;
      max-width: 220px;
      min-width: 220px;
      font-size: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      align-items: flex-start;
      text-align: left;
      margin-right: auto;
      margin-left: 0;
    }

    /* Enlarge volume slider on desktop */
    .volume-container input[type="range"] {
      width: 80px;
    }

    /* Thumbnail inside the player */
    .thumb {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #ffb703;
      flex-shrink: 0;
      animation: slowRotate 8s linear infinite;
      animation-play-state: paused;
    }

    .thumb.is-playing {
      animation-play-state: running;
    }   

    @keyframes slowRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Truncate long titles with an ellipsis (...) */
    .track-title {
      font-size: 0.72rem;
      font-weight: 500;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      width: 100%;
      line-height: 1.2;
    }

    .track-sub {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.68rem;
      display: block;
      vertical-align: middle;
      line-height: 1.2;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      margin-left: auto;
      align-items: center;
      flex-wrap: nowrap;
      gap: 8px;
      flex-shrink: 0;
    }

    .controls button {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #ffffff;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none !important;
    }

    .controls button:focus,
    .controls button:active {
      outline: none !important;
      box-shadow: none !important;
    }

    /* Standard control buttons hover (desktop only) */
    @media (hover: hover) and (pointer: fine) {
      .controls button:hover {
        background: #ffb703 !important;
        color: #000000 !important;
      }
    }

    .controls button.is-pressed,
    .controls button.is-active {
      background: #ffb703 !important;
      color: #000000 !important;
    }   

    .volume-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      margin-left: 2px;
      flex-shrink: 0;
    }

    .volume-container input[type="range"] {
      width: 60px;
      accent-color: #ffb703;
      cursor: pointer;
    }

    /* Playing State (|| appearing): White text on semi-transparent background */
    #playBtn:not(.is-paused),
    #playBtn:not(.is-paused):focus,
    #playBtn:not(.is-paused):focus-visible,
    #playBtn:not(.is-paused):active {
      background: rgba(255, 255, 255, 0.1) !important;
      color: #ffffff !important;
      outline: none !important;
      box-shadow: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }

    /* Playing State (Desktop Hover Only): Black text on yellow background */
    @media (hover: hover) and (pointer: fine) {
      #playBtn:not(.is-paused):hover {
        background: #ffb703 !important;
        color: #000000 !important;
      }
    }

    /* Paused State (> appearing): Black text on yellow background across all states */
    #playBtn.is-paused,
    #playBtn.is-paused:hover,
    #playBtn.is-paused:focus,
    #playBtn.is-paused:focus-visible,
    #playBtn.is-paused:active {
      background: #ffb703 !important;
      color: #000000 !important;
      outline: none !important;
      box-shadow: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }

        <button onclick="setTimer(30)">30 mins</button>

    </div>
  </div>

      <div class="track-sub" id="trackSinger">Singer</div>
      <div class="track-sub" id="trackYear">Year</div>
      <div class="track-sub" id="trackNum">0 / 00 ➡</div>
    </div>  

    <div class="controls">
      <button id="shuffleBtn" onclick="toggleShuffle()" title="Shuffle">&#x1F500;&#xFE0E;</button>
      <button id="prevBtn" onclick="prevTrack(event)" title="Previous">◀◀</button>
      <button id="playBtn" onclick="togglePlay()" title="Play/Pause">▶</button>
      <button onclick="nextTrack(event)" title="Next">▶▶</button>
    </div>

    <div class="volume-container">
      <span>🔊</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="80" oninput="setVolume(this.value)" />
    </div>
  </div>

    function shufflePlaylist(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    // Separate copies so shuffling doesn't mutate original
    const shuffledList = [...originalPlaylist];
    shufflePlaylist(shuffledList);

    let isShuffleOn = false;    
    let currentIndex = 0;    
    let ytPlayer;
    let isAudioMuted = true;

    function getActivePlaylist() {
      return isShuffleOn ? shuffledList : originalPlaylist;
    }

    function onYouTubeIframeAPIReady() {
      const activeList = getActivePlaylist();
      ytPlayer = new YT.Player('player', {
        height: '1',
        width: '1',
        videoId: activeList[currentIndex],
        playerVars: { 
          'autoplay': 1,
          'mute': 1,
          'controls': 0,
          'playsinline': 1
        },
        events: {
          'onReady': function(event) {
            event.target.mute();
            event.target.setVolume(50);
            updateMuteUI();
            updateUI();
          },
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }    

    document.addEventListener('click', function unmuteOnFirstClick(e) {
      if (e.target.closest('#muteBtn')) return;
      if (isAudioMuted) {
        isAudioMuted = false;
        if (ytPlayer && typeof ytPlayer.unMute === 'function') {
          ytPlayer.unMute();
          ytPlayer.setVolume(100);
        }
        updateMuteUI();
      }
    }, { once: true });

    document.addEventListener('DOMContentLoaded', function() {
      const muteBtn = document.getElementById('muteBtn');
      if (muteBtn) {
        muteBtn.addEventListener('click', function() {
          isAudioMuted = !isAudioMuted;
          if (ytPlayer && typeof ytPlayer.unMute === 'function') {
            if (isAudioMuted) {
              ytPlayer.mute();
            } else {
              ytPlayer.unMute();
              ytPlayer.setVolume(100);
            }
          }
          updateMuteUI();
        });
      }
    });

    function updateMuteUI() {
      const muteIcon = document.getElementById('muteIcon');
      const muteBtn = document.getElementById('muteBtn');
      if (!muteIcon) return;

      if (isAudioMuted) {
        muteIcon.textContent = '🔇';
        if (muteBtn) muteBtn.classList.add('is-muted');
      } else {
        muteIcon.textContent = '🔊';
        if (muteBtn) muteBtn.classList.remove('is-muted');
      }
    }

    if (window.YT && window.YT.Player) {
      onYouTubeIframeAPIReady();
    }
    
    function updateUI() {
      const activeList = getActivePlaylist();
      const id = activeList[currentIndex];
      document.getElementById('trackThumb').src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
      fetchTrackTitle();
    }

    function fetchTrackTitle() {
  try {
    const activeList = getActivePlaylist();
    const videoId = activeList[currentIndex]; 
    const track = localPlaylistData[videoId];

    const shuffleIcon = isShuffleOn ? '\u{1F500}' : '\u{27A1}';
    const trackNumber = currentIndex + 1;
    const totalTracks = activeList.length;

    if (track) {
      document.getElementById('trackTitle').innerText = track.title;
      document.getElementById('trackTitle').title = track.title;

      document.getElementById('trackSinger').innerText = track.Singer;
      document.getElementById('trackYear').innerText = track.Year;
      document.getElementById('trackNum').innerText = `${trackNumber} / ${totalTracks} ${shuffleIcon}`;

      // Populate single-line mobile view metadata
      const mobileMetaElem = document.getElementById('mobileMeta');
      if (mobileMetaElem) {
        mobileMetaElem.innerText = `${track.Singer} • ${track.Year} • ${trackNumber}/${totalTracks} ${shuffleIcon}`;
      }
    }
  } catch (err) {
    console.error("Error inside fetchTrackTitle:", err);
  }
}
    function jumpToTrack(val) {
      let num = parseInt(val, 10);
      if (isNaN(num)) return;

      const activeList = getActivePlaylist();
      if (num < 1) num = 1;
      if (num > activeList.length) num = activeList.length;

      currentIndex = num - 1;
      renderTrackChange();
    }

    function togglePlay() {
      if (!ytPlayer) return;

      const playBtn = document.getElementById('playBtn');
      if (playBtn) playBtn.blur();

      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
      updateUI();
    }

    function toggleShuffle() {
      isShuffleOn = !isShuffleOn;
      const btn = document.getElementById('shuffleBtn');
      if (btn) {
        btn.classList.toggle('is-active', isShuffleOn);
        btn.blur();
      }
      renderTrackChange();
      if (!ytPlayer) return; ytPlayer.pauseVideo(); setTimeout(() => ytPlayer.playVideo(), 1500);
    }

    function flashButton(btn) {
      if (!btn || !(btn instanceof HTMLElement)) return;
      if (btn._timer) clearTimeout(btn._timer);
      btn.classList.add('is-pressed');
      btn._timer = setTimeout(function() {
        btn.classList.remove('is-pressed');
        btn.blur();
        if (document.activeElement) {
          document.activeElement.blur();
        }
      }, 1000);
    }

    function nextTrack(e) {
      if (e && e.preventDefault) e.preventDefault();
      const btn = e ? (e.currentTarget || e.target) : null;
      flashButton(btn);

      const activeList = getActivePlaylist();
      currentIndex = (currentIndex + 1) % activeList.length;
      renderTrackChange();
      if (!ytPlayer) return; ytPlayer.pauseVideo(); setTimeout(() => ytPlayer.playVideo(), 1500);
    }

    function prevTrack(e) {
      if (e && e.preventDefault) e.preventDefault();
      const btn = e ? (e.currentTarget || e.target) : null;
      flashButton(btn);

      const activeList = getActivePlaylist();
      currentIndex = (currentIndex - 1 + activeList.length) % activeList.length;
      renderTrackChange();
      if (!ytPlayer) return; ytPlayer.pauseVideo(); setTimeout(() => ytPlayer.playVideo(), 1500);
    }

    function renderTrackChange() {
      const activeList = getActivePlaylist();	
      const id = activeList[currentIndex];
      const thumb = document.getElementById('trackThumb');

      if (thumb) {
        thumb.src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
      }

      if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
        ytPlayer.loadVideoById(id);
      }
      updateUI();
    }
	  
    document.addEventListener('DOMContentLoaded', function() {
      const buttons = document.querySelectorAll('.controls button');
      buttons.forEach(function(btn) {
        btn.addEventListener('touchend', function() {
          setTimeout(() => btn.blur(), 50);
        });
      });
    });  

    function setVolume(val) {
      if (ytPlayer && ytPlayer.setVolume) {
        ytPlayer.setVolume(val);
      }
    }

    function playNextOrRandom() {
      const activeList = getActivePlaylist();
      currentIndex = (currentIndex + 1) % activeList.length;
      renderTrackChange();
    } 

    let initialLoad = true;
    function onPlayerStateChange(event) {
      const btn = document.getElementById('playBtn');

      if (initialLoad && event.data === YT.PlayerState.PLAYING) {
        initialLoad = false;

        event.target.pauseVideo();
        event.target.unMute();
        event.target.setVolume(100);

        isAudioMuted = false;

        btn.innerText = '▶';
        btn.classList.add('is-paused');

        updateMuteUI();
        updateUI(event);

        return;
      }

      if (event.data === YT.PlayerState.PLAYING) {
        btn.innerText = '⏸';
        btn.classList.remove('is-paused');
        document.getElementById('trackThumb').classList.add('is-playing');
        fetchTrackTitle();

      } else if (event.data === YT.PlayerState.PAUSED) {
        btn.innerText = '▶';
        btn.classList.add('is-paused');
        document.getElementById('trackThumb').classList.remove('is-playing');

      } else if (event.data === YT.PlayerState.ENDED) {
        document.getElementById('trackThumb').classList.remove('is-playing');
        advanceToNextTrack();
      }
    }   

    function advanceToNextTrack() {
      const activeList = getActivePlaylist();  
      currentIndex = (currentIndex + 1) % activeList.length;
      renderTrackChange();
    }

    function onPlayerError(event) {
      console.warn(`Track ${currentIndex + 1} is unplayable. Skipping...`);
      playNextOrRandom();
    }
    
    let currentCount = Math.floor(Math.random() * (25 - 10 + 1)) + 10;

    function updateFakeListeners() {
      const countElem = document.getElementById('listenerCount');
      if (countElem) {
        countElem.innerText = `Online: ${currentCount}`;
        const delta = Math.floor(Math.random() * 5) - 2;
        currentCount = Math.max(5, currentCount + delta);
      }
    }
    updateFakeListeners();
    setInterval(updateFakeListeners, 15000);

    /* Sleep Timer Logic */
    let sleepInterval = null;
    let timeRemaining = 0;

    function toggleSleepMenu() {
      const menu = document.getElementById('sleepMenu');
      menu.classList.toggle('is-open');
    }

    function setTimer(mins) {
      const btn = document.getElementById('sleepBtn');
      document.getElementById('sleepMenu').classList.remove('is-open');

      if (sleepInterval) clearInterval(sleepInterval);

      if (mins === 0) {
        timeRemaining = 0;
        btn.innerText = '🌙 Sleep timer';
        return;
      }

      timeRemaining = mins * 60;
      updateTimerDisplay();

      sleepInterval = setInterval(() => {
        timeRemaining--;

        if (timeRemaining <= 0) {
          clearInterval(sleepInterval);
          if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
            ytPlayer.pauseVideo();
          }
          btn.innerText = '🌙 Sleep timer';
        } else {
          updateTimerDisplay();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const btn = document.getElementById('sleepBtn');
      const m = Math.floor(timeRemaining / 60);
      const s = String(timeRemaining % 60).padStart(2, '0');
      btn.innerText = `⏳ ${m}:${s} left`;
    }

    document.addEventListener('click', function(e) {
      const container = document.querySelector('.timer-container');
      if (container && !container.contains(e.target)) {
        document.getElementById('sleepMenu').classList.remove('is-open');
      }
    });
