<!DOCTYPE html>
<html lang="en">
<head>
	

 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Record Player</title>
 <link rel ="stylesheet" href="style.css">

	
  <!-- Cursive Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  
</head>
<body>


 
  <!-- Background Image -->
  <picture>
    <source media="(max-width: 600px)" srcset="Record_player_mobile_bg.jpg" />
    <!-- <img src="Record_player_bg.jpg" alt="Background" class="bg-image" /> This is manually converted to sepia-->
    <img src="RPD_bg_gpt-sepia.jpg" alt="Background" class="bg-image" />
  </picture>

  <!-- Title -->
  <header class="app-header">
    <h1>Record Player Days</h1>
  </header>

  <!-- Time & Mute -->
  <div class="top-right-container">
    <div id="clockDisplay" class="time-display">00:00</div>
    <div id="listenerCount" class="listener-count">Online: --</div>
    <button id="muteBtn" class="mute-btn" aria-label="Toggle Sound">
      <span id="muteIcon">🔇</span>
    </button>
  </div>

  <!-- Elevated Sleep Timer Bar -->
  <div class="timer-bar">
    <div class="timer-container">
      <div id="sleepMenu" class="sleep-menu">
        <button onclick="setTimer(30)">30 mins</button>
        <button onclick="setTimer(45)">45 mins</button>
        <button onclick="setTimer(60)">60 mins</button>
        <button onclick="setTimer(0)" style="color: #ff6b6b;">Turn off</button>
      </div>
      <button id="sleepBtn" onclick="toggleSleepMenu()">🌙 Sleep timer</button>
    </div>
  </div>

  <!-- Single Player Container -->
  <div class="player-bar">
    <!-- Row 1: Song Title Centered Above Controls -->
    <div class="track-title-row">
      <div class="track-title" id="trackTitle">Title</div>
    </div>

    <!-- Row 2: Thumbnail, Controls, Volume (Centered) -->
    <div class="player-controls-row">
      <img id="trackThumb" src="" alt="Thumb" class="thumb" />

     <div class="player-controls">
  <!-- Shuffle -->
  <button id="shuffleBtn" class="control-btn" aria-label="Shuffle" title="Shuffle">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
      <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
    </svg>
  </button>

  <!-- Previous -->
  <button id="prevBtn" class="control-btn" aria-label="Previous" title="Previous">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
      <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
    </svg>
  </button>

  <!-- Play / Pause -->
  <button id="playBtn" class="control-btn play-btn" aria-label="Play / Pause">
    <!-- Play icon -->
    <svg class="icon-play" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
      <path d="M8 5v14l11-7z"/>
    </svg>
    <!-- Pause icon -->
    <svg class="icon-pause" viewBox="0 0 24 24" width="32" height="32" fill="currentColor" hidden>
      <path d="M6 4h4v16H6zm8 0h4v16h-4z"/>
    </svg>
  </button>

  <!-- Next -->
  <button id="nextBtn" class="control-btn" aria-label="Next" title="Next">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
      <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
    </svg>
  </button>
</div>
      <div class="volume-container">
        <span>🔊</span>
        <input type="range" id="volumeSlider" min="0" max="100" value="80" oninput="setVolume(this.value)" />
      </div>
    </div>

    <!-- Row 3: Metadata (Singer • Year • Track Count / Shuffle) -->
    <div id="playerMeta" class="meta-details-row"></div>
  </div>

  <!-- YouTube Playlist Link -->
  <a href="https://www.youtube.com/playlist?list=PLKSjwCo_iCIQ&si=nY1K75Vzp0RLT9Dl" target="_blank" class="yt-link-text" rel="noopener noreferrer">Listen on YouTube.</a>
  <a href="/Contact.html" target="_blank" class="contact-text" rel="noopener noreferrer">Suggest a song!</a>
  
  <div id="player" class="audio-engine"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="playlist.js"></script>
  <script src="script.js"></script>

 
</body>
</html>
